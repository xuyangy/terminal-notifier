name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the release step can diff against the previous tag.
          fetch-depth: 0

      - name: Check tag matches Info.plist version
        run: |
          plist_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "Terminal Notifier/Terminal Notifier-Info.plist")
          if [ "v${plist_version}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString ${plist_version} in Info.plist." >&2
            echo "::error::Bump the plist version (and CFBundleVersion) before tagging." >&2
            exit 1
          fi

      - name: Build production app
        run: |
          xcodebuild \
            -project "Terminal Notifier.xcodeproj" \
            -scheme "Terminal Notifier" \
            -configuration Release \
            SYMROOT="$PWD/build" \
            -derivedDataPath "$PWD/build/DerivedData" \
            MACOSX_DEPLOYMENT_TARGET=10.14 \
            PRODUCT_BUNDLE_IDENTIFIER=fr.julienxx.oss.terminal-notifier \
            build

      - name: Package app
        run: scripts/package.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_tag=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What's changed"
            echo
            if [ -n "$prev_tag" ]; then
              # The version-bump commit is implied by the release itself.
              git log --no-merges --format='- %s (%h)' "${prev_tag}..${GITHUB_REF_NAME}" \
                | grep -v '^- Bump version to ' || true
              echo
              echo "**Full diff**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            else
              echo "Initial release."
            fi
            echo
            echo "---"
            echo
            echo "macOS 10.14+ build of terminal-notifier using UserNotifications."
            echo
            echo "This artifact is built and ad-hoc signed by GitHub Actions. Developer ID"
            echo "signing and notarization are not configured yet, so macOS may show"
            echo "Gatekeeper warnings for downloaded builds."
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME" build/package/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
